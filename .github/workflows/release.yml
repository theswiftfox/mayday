name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.1.0). Leave empty to use
          apps/desktop/package.json version."
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/service
            apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import code signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Write API key file
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$APPLE_API_KEY_CONTENT" > ~/private_keys/AuthKey_${APPLE_API_KEY}.p8

      - name: Build and sign (aarch64)
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm tauri build --target aarch64-apple-darwin

      - name: Build and sign (x86_64)
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm tauri build --target x86_64-apple-darwin

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "version=$(echo '${{ inputs.version }}' | sed 's/^v//')" >> $GITHUB_OUTPUT
          else
            VERSION=$(jq -r .version apps/desktop/package.json)
            echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Collect artifacts
        run: |
          mkdir -p release-artifacts

          # DMG files (for direct download)
          cp target/aarch64-apple-darwin/release/bundle/dmg/*.dmg release-artifacts/ 2>/dev/null || true
          cp target/x86_64-apple-darwin/release/bundle/dmg/*.dmg release-artifacts/ 2>/dev/null || true

          # Updater bundles (.tar.gz) and signatures (.sig)
          for f in target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .app.tar.gz)
            cp "$f" "release-artifacts/${base}_aarch64.app.tar.gz"
            [ -f "${f}.sig" ] && cp "${f}.sig" "release-artifacts/${base}_aarch64.app.tar.gz.sig"
          done

          for f in target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .app.tar.gz)
            cp "$f" "release-artifacts/${base}_x86_64.app.tar.gz"
            [ -f "${f}.sig" ] && cp "${f}.sig" "release-artifacts/${base}_x86_64.app.tar.gz.sig"
          done

          ls -la release-artifacts/

          # Fail if expected artifacts are missing
          DMG_COUNT=$(ls release-artifacts/*.dmg 2>/dev/null | wc -l)
          BUNDLE_COUNT=$(ls release-artifacts/*.tar.gz 2>/dev/null | wc -l)
          SIG_COUNT=$(ls release-artifacts/*.tar.gz.sig 2>/dev/null | wc -l)

          if [ "$DMG_COUNT" -eq 0 ]; then
            echo "ERROR: No DMG files found in release-artifacts/"
            exit 1
          fi
          if [ "$BUNDLE_COUNT" -eq 0 ]; then
            echo "ERROR: No updater bundles (.tar.gz) found in release-artifacts/"
            exit 1
          fi
          if [ "$SIG_COUNT" -eq 0 ]; then
            echo "ERROR: No updater signatures (.tar.gz.sig) found in release-artifacts/"
            exit 1
          fi

          echo "Collected $DMG_COUNT DMG(s), $BUNDLE_COUNT bundle(s), $SIG_COUNT signature(s)"

      - name: Generate latest.json for updater
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          REPO="theswiftfox/mayday"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Find the renamed updater bundles and read their signatures
          AARCH64_FILE=$(ls release-artifacts/*_aarch64.app.tar.gz 2>/dev/null | head -1)
          X86_64_FILE=$(ls release-artifacts/*_x86_64.app.tar.gz 2>/dev/null | head -1)

          AARCH64_SIG=""
          X86_64_SIG=""
          if [ -n "$AARCH64_FILE" ] && [ -f "${AARCH64_FILE}.sig" ]; then
            AARCH64_SIG=$(cat "${AARCH64_FILE}.sig")
          fi
          if [ -n "$X86_64_FILE" ] && [ -f "${X86_64_FILE}.sig" ]; then
            X86_64_SIG=$(cat "${X86_64_FILE}.sig")
          fi

          AARCH64_BASENAME=$(basename "$AARCH64_FILE")
          X86_64_BASENAME=$(basename "$X86_64_FILE")

          cat > release-artifacts/latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "See release notes at https://github.com/${REPO}/releases/tag/${TAG}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${AARCH64_SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/${AARCH64_BASENAME}"
              },
              "darwin-x86_64": {
                "signature": "${X86_64_SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/${X86_64_BASENAME}"
              }
            }
          }
          EOF

          echo "Generated latest.json:"
          cat release-artifacts/latest.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-builds
          path: release-artifacts/*

      - name: Create GitHub Release
        if: inputs.version != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: release-artifacts/*
          generate_release_notes: true
          draft: true
